{% if messages %}

<div class="fixed top-5 right-5 z-50 flex flex-col gap-3">

    {% for message in messages %}

    <div
        id="toast-{{ forloop.counter }}"
        class="
            toast-message
            flex items-center gap-3
            min-w-75
            max-w-100
            px-4 py-3
            rounded-xl
            shadow-xl
            border
            backdrop-blur-md
            animate-toast
            {% if message.tags == 'success' %}
                bg-green-50 border-green-200 text-green-800
            {% elif message.tags == 'error' %}
                bg-red-50 border-red-200 text-red-800
            {% elif message.tags == 'warning' %}
                bg-yellow-50 border-yellow-200 text-yellow-800
            {% else %}
                bg-white border-gray-200 text-gray-800
            {% endif %}
        "
    >
        <div class="shrink-0">

            {% if message.tags == 'success' %}
                <i class="bi bi-check-circle-fill text-green-500 text-lg"></i>

            {% elif message.tags == 'error' %}
                <i class="bi bi-x-circle-fill text-red-500 text-lg"></i>

            {% elif message.tags == 'warning' %}
                <i class="bi bi-exclamation-triangle-fill text-yellow-500 text-lg"></i>

            {% else %}
                <i class="bi bi-info-circle-fill text-gray-500 text-lg"></i>
            {% endif %}

        </div>
        <div class="flex-1 text-sm font-medium">
            {{ message }}
        </div>
        <button
            onclick="closeToast('toast-{{ forloop.counter }}')"
            class="opacity-50 hover:opacity-100 transition"
        >
            <i class="bi bi-x-lg"></i>
        </button>

    </div>

    {% endfor %}

</div>

<style>

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateX(100%);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.animate-toast {
    animation: toastIn 0.4s ease;
}

</style>

<script>

function closeToast(id) {

    const toast = document.getElementById(id);

    if (toast) {

        toast.style.transition = 'all 0.5s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';

        setTimeout(() => {
            toast.remove();
        }, 500);
    }
}

document.addEventListener('DOMContentLoaded', () => {

    document.querySelectorAll('.toast-message').forEach((toast) => {

        setTimeout(() => {

            toast.style.transition = 'all 0.5s ease';
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';

            setTimeout(() => {
                toast.remove();
            }, 500);

        }, 3000);

    });

});

</script>

{% endif %}
